<!DOCTYPE html>
<html>
<head>
    <title>Product List</title>
</head>
<body>
    <h1>All Products</h1>

    {% if products %}
        <ul>
            {% for product in products %}
                <li>{{ product.name }} – ₹{{ product.price }}</li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No products found.</p>
    {% endif %}
</body>
</html>
